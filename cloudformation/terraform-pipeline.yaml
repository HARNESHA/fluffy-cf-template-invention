AWSTemplateFormatVersion: "2010-09-09"
Description: "Terraform CI/CD Pipeline Platform - Enterprise Terraform deployment pipeline using CodePipeline, CodeBuild, and S3 backend with native lockfile support"

Parameters:
  ProjectName:
    Type: String
    Description: Project/system identifier used for resource naming
    AllowedPattern: ^[a-z0-9][a-z0-9-]*[a-z0-9]$
    ConstraintDescription: Must contain only lowercase alphanumeric and hyphens

  EnvironmentName:
    Type: String
    Description: Deployment environment
    AllowedValues:
      - dev
      - qa
      - uat
      - prod
    Default: dev

  TerraformRepoName:
    Type: String
    Description: Name of the AWS CodeCommit repository containing Terraform code

  TerraformRepoBranch:
    Type: String
    Description: Branch to trigger deployments from
    Default: main

  TerraformVersion:
    Type: String
    Description: Terraform version to install in CodeBuild
    Default: 1.10.5

  ArtifactBucketName:
    Type: String
    Description: Name for pipeline artifact S3 bucket (globally unique)
    AllowedPattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$

  BackendBucketName:
    Type: String
    Description: Name for Terraform state backend S3 bucket (globally unique)
    AllowedPattern: ^[a-z0-9][a-z0-9.-]*[a-z0-9]$

  EnableManualApproval:
    Type: String
    Description: Enable manual approval stage between Plan and Apply
    AllowedValues:
      - Yes
      - No
    Default: Yes

  NotificationEmail:
    Type: String
    Description: Email for SNS approval notifications (leave empty to disable)
    Default: ""

  CodeBuildComputeType:
    Type: String
    Description: CodeBuild compute type
    AllowedValues:
      - BUILD_GENERAL1_SMALL
      - BUILD_GENERAL1_MEDIUM
      - BUILD_GENERAL1_LARGE
    Default: BUILD_GENERAL1_SMALL

  BuildImage:
    Type: String
    Description: CodeBuild build image
    Default: aws/codebuild/amazonlinux2-x86_64-standard:5.0

  TargetAccountId:
    Type: String
    Description: Target AWS account ID for cross-account deployment (leave empty if same account)
    Default: ""

  TargetRoleArn:
    Type: String
    Description: IAM role ARN in target account for cross-account deployment (leave empty if not used)
    Default: ""

  TerraformRootPath:
    Type: String
    Description: Relative path to Terraform root module in the repository (use "." for repo root)
    Default: "."
    AllowedPattern: ^[a-zA-Z0-9/._-]+$

Conditions:
  EnableManualApproval: !Equals [!Ref EnableManualApproval, "Yes"]
  EnableNotifications: !Not [!Equals [!Ref NotificationEmail, ""]]
  IsCrossAccount: !Not [!Equals [!Ref TargetRoleArn, ""]]

Resources:
  # ============================================================
  # TERRAFORM BACKEND S3 BUCKET
  # ============================================================
  BackendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Ref BackendBucketName
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldVersions
            Status: Enabled
            NoncurrentVersionExpirationInDays: 90
          - Id: ExpireCurrentVersions
            Status: Enabled
            ExpirationInDays: 365
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  BackendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BackendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTlsRequests
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${BackendBucket.Arn}"
              - !Sub "${BackendBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  # ============================================================
  # PIPELINE ARTIFACT S3 BUCKET
  # ============================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref ArtifactBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
          - Id: AbortIncompleteUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: EnforceTlsRequests
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${ArtifactBucket.Arn}"
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                "aws:SecureTransport": false

  # ============================================================
  # CLOUDWATCH LOGS
  # ============================================================
  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${ProjectName}-${EnvironmentName}-tf"
      RetentionInDays: 30

  PipelineLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codepipeline/${ProjectName}-${EnvironmentName}-tf"
      RetentionInDays: 30

  # ============================================================
  # SNS TOPIC (OPTIONAL)
  # ============================================================
  NotificationTopic:
    Type: AWS::SNS::Topic
    Condition: EnableNotifications
    Properties:
      TopicName: !Sub "${ProjectName}-${EnvironmentName}-tf-approval"
      DisplayName: !Sub "${ProjectName} ${EnvironmentName} Terraform Pipeline"

  NotificationTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Condition: EnableNotifications
    Properties:
      Topics:
        - !Ref NotificationTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCodePipelinePublish
            Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sns:Publish
            Resource: !Ref NotificationTopic

  NotificationSubscription:
    Type: AWS::SNS::Subscription
    Condition: EnableNotifications
    Properties:
      Protocol: email
      Endpoint: !Ref NotificationEmail
      TopicArn: !Ref NotificationTopic

  # ============================================================
  # IAM: CODEBUILD ROLE
  # ============================================================
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-codebuild-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-${EnvironmentName}-codebuild-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BackendBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "${BackendBucket.Arn}"
                  - !Sub "${BackendBucket.Arn}/*"
              - Sid: ArtifactBucketAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:PutObjectAcl
                Resource:
                  - !Sub "${ArtifactBucket.Arn}"
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${CodeBuildLogGroup.Arn}"
                  - !Sub "${CodeBuildLogGroup.Arn}:*"
              - !If
                - IsCrossAccount
                -
                  Sid: CrossAccountAssumeRole
                  Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Ref TargetRoleArn
                - !Ref "AWS::NoValue"

  # ============================================================
  # IAM: PIPELINE ROLE
  # ============================================================
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-${EnvironmentName}-pipeline-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: S3ArtifactAccess
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:PutObjectAcl
                Resource:
                  - !Sub "${ArtifactBucket.Arn}"
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: CodeCommitReadAccess
                Effect: Allow
                Action:
                  - codecommit:GitPull
                  - codecommit:GetBranch
                  - codecommit:GetCommit
                  - codecommit:UploadArchive
                  - codecommit:GetUploadArchiveStatus
                Resource: !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${TerraformRepoName}"
              - Sid: CodeBuildAccess
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
                  - codebuild:StopBuild
                Resource: !GetAtt CodeBuildProject.Arn
              - Sid: PassRoleToCodeBuild
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CodeBuildRole.Arn
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub "${PipelineLogGroup.Arn}"
                  - !Sub "${PipelineLogGroup.Arn}:*"
              - !If
                - EnableNotifications
                -
                  Sid: SNSApprovalNotification
                  Effect: Allow
                  Action: sns:Publish
                  Resource: !Ref NotificationTopic
                - !Ref "AWS::NoValue"

  # ============================================================
  # CODEBUILD PROJECT
  # ============================================================
  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-tf-build"
      Description: !Sub "Terraform ${ProjectName} ${EnvironmentName} build"
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: !Ref CodeBuildComputeType
        Image: !Ref BuildImage
        ImagePullCredentialsType: CODEBUILD
        EnvironmentVariables:
          - Name: ENV
            Value: !Ref EnvironmentName
            Type: PLAINTEXT
          - Name: BACKEND_BUCKET
            Value: !Ref BackendBucketName
            Type: PLAINTEXT
          - Name: PROJECT_NAME
            Value: !Ref ProjectName
            Type: PLAINTEXT
          - Name: AWS_REGION
            Value: !Ref AWS::Region
            Type: PLAINTEXT
          - Name: TERRAFORM_VERSION
            Value: !Ref TerraformVersion
            Type: PLAINTEXT
          - Name: TERRAFORM_ROOT_PATH
            Value: !Ref TerraformRootPath
            Type: PLAINTEXT
          - Name: TARGET_ROLE_ARN
            Value: !Ref TargetRoleArn
            Type: PLAINTEXT
      Source:
        Type: CODEPIPELINE
        BuildSpec: !Sub |
          version: 0.2

          phases:
            install:
              commands:
                - |
                  echo "Installing Terraform ${TERRAFORM_VERSION}..."
                  TERRAFORM_URL="https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
                  curl -fsSL "$${TERRAFORM_URL}" -o /tmp/terraform.zip
                  unzip -o /tmp/terraform.zip -d /usr/local/bin/
                  terraform --version
                - |
                  INSTALLED_VERSION=$(terraform version -json | jq -r '.terraform_version')
                  echo "Validating Terraform version >= 1.10..."
                  if [ "$$(printf '%s\n' "1.10" "$${INSTALLED_VERSION}" | sort -V | head -n1)" != "1.10" ]; then
                    echo "ERROR: Terraform version $${INSTALLED_VERSION} < required minimum 1.10"
                    exit 1
                  fi
                  echo "Terraform version $${INSTALLED_VERSION} validated"

            pre_build:
              commands:
                - cd ${TERRAFORM_ROOT_PATH}
                - |
                  echo "Generating backend configuration for ${ENV}..."
                  cat > backend-${ENV}.hcl <<EOF
                  bucket         = "${BACKEND_BUCKET}"
                  key            = "${PROJECT_NAME}/${ENV}/terraform.tfstate"
                  region         = "${AWS_REGION}"
                  encrypt        = true
                  use_lockfile   = true
                  EOF
                - |
                  if [ -n "${TARGET_ROLE_ARN}" ] && [ "${TARGET_ROLE_ARN}" != "" ]; then
                    echo "Assuming cross-account role: ${TARGET_ROLE_ARN}"
                    CREDENTIALS=$(aws sts assume-role --role-arn "${TARGET_ROLE_ARN}" --role-session-name "terraform-${TF_ACTION}-${ENV}" --duration-seconds 3600)
                    export AWS_ACCESS_KEY_ID=$$(echo $${CREDENTIALS} | jq -r '.Credentials.AccessKeyId')
                    export AWS_SECRET_ACCESS_KEY=$$(echo $${CREDENTIALS} | jq -r '.Credentials.SecretAccessKey')
                    export AWS_SESSION_TOKEN=$$(echo $${CREDENTIALS} | jq -r '.Credentials.SessionToken')
                    echo "Successfully assumed role"
                  fi
                - terraform init -backend-config=backend-${ENV}.hcl -reconfigure

            build:
              commands:
                - |
                  if [ "${TF_ACTION}" = "plan" ]; then
                    echo "=== TERRAFORM PLAN ==="
                    echo "Running terraform fmt check..."
                    terraform fmt -check -recursive || echo "Warning: Formatting issues detected"
                    echo "Running terraform validate..."
                    terraform validate
                    echo "Managing workspace ${ENV}..."
                    terraform workspace select ${ENV} || terraform workspace new ${ENV}
                    echo "Running terraform plan..."
                    terraform plan -var-file=environments/${ENV}.tfvars -out=tfplan
                  elif [ "${TF_ACTION}" = "apply" ]; then
                    echo "=== TERRAFORM APPLY ==="
                    if [ -f "$${CODEBUILD_SRC_DIR_PlanArtifact}/tfplan" ]; then
                      echo "Using approved plan from PlanArtifact..."
                      cp -v "$${CODEBUILD_SRC_DIR_PlanArtifact}/tfplan" .
                    else
                      echo "ERROR: tfplan not found in PlanArtifact"
                      ls -la "$${CODEBUILD_SRC_DIR_PlanArtifact}/" 2>/dev/null || echo "PlanArtifact directory not found"
                      exit 1
                    fi
                    echo "Selecting workspace ${ENV}..."
                    terraform workspace select ${ENV}
                    echo "Running terraform apply with approved plan..."
                    terraform apply -auto-approve tfplan
                  else
                    echo "ERROR: Unknown TF_ACTION: ${TF_ACTION}"
                    exit 1
                  fi

            post_build:
              commands:
                - echo "Terraform ${TF_ACTION} completed for ${PROJECT_NAME}:${ENV}"

          artifacts:
            files:
              - '**/tfplan'
            discard-paths: yes

      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref CodeBuildLogGroup
        S3Logs:
          Status: DISABLED
      TimeoutInMinutes: 60
      QueuedTimeoutInMinutes: 10

  # ============================================================
  # CODEPIPELINE
  # ============================================================
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    DependsOn:
      - CodeBuildProject
      - PipelineRole
      - ArtifactBucket
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-tf-pipeline"
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: Source
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeCommit
                Version: "1"
              Configuration:
                RepositoryName: !Ref TerraformRepoName
                BranchName: !Ref TerraformRepoBranch
                PollForSourceChanges: false
              OutputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        - Name: ValidateAndPlan
          Actions:
            - Name: TerraformPlan
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
                EnvironmentVariables: !Sub |
                  [
                    {"name":"TF_ACTION","value":"plan","type":"PLAINTEXT"}
                  ]
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: PlanArtifact
              RunOrder: 1

        - Name: Approval
          Condition: EnableManualApproval
          Actions:
            - Name: ManualApproval
              ActionTypeId:
                Category: Approval
                Owner: AWS
                Provider: Manual
                Version: "1"
              Configuration:
                NotificationArn: !If
                  - EnableNotifications
                  - !Ref NotificationTopic
                  - !Ref "AWS::NoValue"
                CustomData: !Sub |
                  Project: ${ProjectName}
                  Environment: ${EnvironmentName}
                  Repository: ${TerraformRepoName}
                  Branch: ${TerraformRepoBranch}
                  Action: Approve or reject this Terraform deployment
              RunOrder: 1

        - Name: Apply
          Actions:
            - Name: TerraformApply
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
                EnvironmentVariables: !Sub |
                  [
                    {"name":"TF_ACTION","value":"apply","type":"PLAINTEXT"}
                  ]
              InputArtifacts:
                - Name: SourceArtifact
                - Name: PlanArtifact
              RunOrder: 1

  # ============================================================
  # CLOUDWATCH EVENTS: PIPELINE TRIGGER
  # ============================================================
  CloudWatchEventsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-events-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub "${ProjectName}-${EnvironmentName}-events-policy"
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: StartPipelineExecution
                Effect: Allow
                Action: codepipeline:StartPipelineExecution
                Resource: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"

  PipelineCodeCommitTrigger:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-tf-codecommit-trigger"
      EventPattern:
        source:
          - aws.codecommit
        detail-type:
          - CodeCommit Repository State Change
        resources:
          - !Sub "arn:${AWS::Partition}:codecommit:${AWS::Region}:${AWS::AccountId}:${TerraformRepoName}"
        detail:
          event:
            - referenceCreated
            - referenceUpdated
          referenceType:
            - branch
          referenceName:
            - !Ref TerraformRepoBranch
      State: ENABLED
      Targets:
        - Id: PipelineTarget
          Arn: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
          RoleArn: !GetAtt CloudWatchEventsRole.Arn

Outputs:
  PipelineName:
    Description: CodePipeline name
    Value: !Ref Pipeline
  PipelineArn:
    Description: CodePipeline ARN
    Value: !Sub "arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:${Pipeline}"
  CodeBuildProjectName:
    Description: CodeBuild project name
    Value: !Ref CodeBuildProject
  BackendBucketName:
    Description: Terraform state backend S3 bucket
    Value: !Ref BackendBucket
  ArtifactBucketName:
    Description: Pipeline artifact S3 bucket
    Value: !Ref ArtifactBucket
  CodeBuildRoleArn:
    Description: CodeBuild IAM role ARN
    Value: !GetAtt CodeBuildRole.Arn
  PipelineRoleArn:
    Description: CodePipeline IAM role ARN
    Value: !GetAtt PipelineRole.Arn
  LogGroupName:
    Description: CloudWatch Log Group for CodeBuild
    Value: !Ref CodeBuildLogGroup
  NotificationTopicArn:
    Description: SNS notification topic ARN
    Condition: EnableNotifications
    Value: !Ref NotificationTopic
