AWSTemplateFormatVersion: "2010-09-09"
Description: >
  codecommit-event-forwarder.yaml | Version: 1.0.0
  Deploys into Repository Accounts (via CloudFormation StackSets).
  Forwards CodeCommit Repository State Change events to the custom EventBridge
  Event Bus in the central Pipeline Account. Supports branch-level filtering.
  Only grants events:PutEvents - nothing more. The cross-account pipeline
  Source-stage access is configured separately (repository policy), see
  docs/deployment-guide.md Step 3.

# ==============================================================================
# METADATA
# ==============================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "1. Repository Configuration"
        Parameters: [RepositoryName, BranchName]
      - Label:
          default: "2. Pipeline Account Target"
        Parameters: [PipelineAccountId, PipelineEventBusArn]
      - Label:
          default: "3. Feature Flags"
        Parameters: [EnableForwarding, ForwardDeleteEvents]
      - Label:
          default: "4. Tagging"
        Parameters: [ProjectName, Environment, Owner, CostCenter]
    ParameterLabels:
      RepositoryName:      { default: "CodeCommit Repository Name" }
      BranchName:          { default: "Branch Name to Forward Events For" }
      PipelineAccountId:   { default: "Pipeline Account ID (12 digits)" }
      PipelineEventBusArn: { default: "Pipeline Account Event Bus ARN" }
      EnableForwarding:    { default: "Enable Event Forwarding" }
      ForwardDeleteEvents: { default: "Also Forward Reference Deleted Events" }
      ProjectName:         { default: "Project Name (for tagging)" }
      Environment:         { default: "Environment" }
      Owner:               { default: "Owner Tag" }
      CostCenter:          { default: "Cost Center Tag" }

# ==============================================================================
# PARAMETERS
# ==============================================================================
Parameters:

  # ----------------------------------------------------------------------------
  # Repository Configuration
  # ----------------------------------------------------------------------------
  RepositoryName:
    Type: String
    Description: >
      Name of the CodeCommit repository in this account whose push events
      should be forwarded to the pipeline account.
    AllowedPattern: "^[a-zA-Z0-9._\\-]{1,100}$"
    ConstraintDescription: Valid CodeCommit repository name (1-100 chars).

  BranchName:
    Type: String
    Description: >
      Git branch name to monitor. Only push events on this branch are forwarded.
      Use 'main', 'master', or your release branch name.
    Default: main
    AllowedPattern: "^[a-zA-Z0-9/_\\-\\.]{1,255}$"

  # ----------------------------------------------------------------------------
  # Pipeline Account Target
  # ----------------------------------------------------------------------------
  PipelineAccountId:
    Type: String
    Description: >
      AWS Account ID of the Pipeline Account that owns the target Event Bus.
      This account must have a resource policy allowing this account to put events.
    AllowedPattern: "^\\d{12}$"
    ConstraintDescription: Must be a 12-digit AWS Account ID.

  PipelineEventBusArn:
    Type: String
    Description: >
      Full ARN of the custom EventBridge Event Bus in the Pipeline Account.
      Format: arn:aws:events:<region>:<account-id>:event-bus/<bus-name>
    AllowedPattern: "^arn:aws:events:[a-z0-9\\-]+:\\d{12}:event-bus\\/[a-zA-Z0-9._\\-\\/]{1,256}$"
    ConstraintDescription: Must be a valid EventBridge Event Bus ARN.

  # ----------------------------------------------------------------------------
  # Feature Flags
  # ----------------------------------------------------------------------------
  EnableForwarding:
    Type: String
    Description: >
      Master switch to enable or disable this forwarder.
      Set to 'false' to pause forwarding without deleting the stack.
    AllowedValues: ["true", "false"]
    Default: "true"

  ForwardDeleteEvents:
    Type: String
    Description: >
      Also forward 'referenceDeleted' events (branch/tag deletions).
      Useful for cleanup pipelines. Leave false for standard CI/CD.
    AllowedValues: ["true", "false"]
    Default: "false"

  # ----------------------------------------------------------------------------
  # Tagging
  # ----------------------------------------------------------------------------
  ProjectName:
    Type: String
    Description: Project identifier for tagging purposes.
    Default: "unassigned"

  Environment:
    Type: String
    Description: Environment label for tagging.
    AllowedValues: [dev, staging, prod, shared]
    Default: dev

  Owner:
    Type: String
    Description: Owner team or individual for tagging.
    Default: "platform-engineering"

  CostCenter:
    Type: String
    Description: Cost center code for billing allocation.
    Default: "unassigned"

# ==============================================================================
# CONDITIONS
# ==============================================================================
Conditions:

  # Is event forwarding enabled?
  ForwardingEnabled: !Equals [!Ref EnableForwarding, "true"]

  # Include referenceDeleted events in the filter?
  IncludeDeleteEvents: !Equals [!Ref ForwardDeleteEvents, "true"]


# ==============================================================================
# RESOURCES
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # IAM ROLE - EventBridge Cross-Account PutEvents Role
  # Assumed by EventBridge in this account to send events to the pipeline
  # account's custom Event Bus.
  # Least-privilege: ONLY events:PutEvents on the exact target bus ARN.
  # ----------------------------------------------------------------------------
  EventForwarderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RepositoryName}-${BranchName}-event-forwarder-role"
      Description: !Sub >-
        Allows EventBridge in ${AWS::AccountId} to forward CodeCommit events
        for ${RepositoryName}/${BranchName} to the pipeline account Event Bus.
        Least-privilege: only events:PutEvents on the target bus.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowEventBridgeAssume
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: "sts:AssumeRole"
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: PutEventsToPipelineBus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: PutEventsToPipelineAccountBus
                Effect: Allow
                Action:
                  - "events:PutEvents"
                Resource:
                  - !Ref PipelineEventBusArn
      Tags:
        - Key: Name
          Value: !Sub "${RepositoryName}-${BranchName}-event-forwarder-role"
        - Key: Project
          Value: !Ref ProjectName
        - Key: Repository
          Value: !Ref RepositoryName
        - Key: Branch
          Value: !Ref BranchName
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation
        - Key: CostCenter
          Value: !Ref CostCenter
        - Key: Owner
          Value: !Ref Owner

  # ----------------------------------------------------------------------------
  # EVENTBRIDGE RULE - CodeCommit Event Forwarder
  # Captures CodeCommit Repository State Change events on the default event bus
  # (where CodeCommit always publishes) and forwards them to the pipeline
  # account's custom Event Bus.
  #
  # Filter logic:
  #   - source:          aws.codecommit
  #   - detail-type:     CodeCommit Repository State Change
  #   - referenceType:   branch (explicitly excludes tag events)
  #   - referenceName:   exact branch match (parameterized)
  #   - repositoryName:  exact repository match (parameterized)
  #   - event:           referenceCreated + referenceUpdated (+ optionally referenceDeleted)
  # ----------------------------------------------------------------------------
  CodeCommitForwarderRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${RepositoryName}-${BranchName}-codecommit-forwarder"
      Description: !Sub >-
        Forwards CodeCommit push events from ${RepositoryName}/${BranchName}
        to the Terraform pipeline Event Bus in account ${PipelineAccountId}.
      # CodeCommit always publishes to the default event bus
      EventBusName: default
      State: !If [ForwardingEnabled, "ENABLED", "DISABLED"]
      EventPattern: !If
        - IncludeDeleteEvents
        # Pattern WITH delete events
        - source:
            - "aws.codecommit"
          detail-type:
            - "CodeCommit Repository State Change"
          resources:
            - !Sub "arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}"
          detail:
            repositoryName:
              - !Ref RepositoryName
            referenceType:
              - "branch"
            referenceName:
              - !Ref BranchName
            event:
              - "referenceCreated"
              - "referenceUpdated"
              - "referenceDeleted"
        # Pattern WITHOUT delete events (default)
        - source:
            - "aws.codecommit"
          detail-type:
            - "CodeCommit Repository State Change"
          resources:
            - !Sub "arn:aws:codecommit:${AWS::Region}:${AWS::AccountId}:${RepositoryName}"
          detail:
            repositoryName:
              - !Ref RepositoryName
            referenceType:
              - "branch"
            referenceName:
              - !Ref BranchName
            event:
              - "referenceCreated"
              - "referenceUpdated"
      Targets:
        - Id: PipelineAccountEventBus
          Arn: !Ref PipelineEventBusArn
          RoleArn: !GetAtt EventForwarderRole.Arn

# ==============================================================================
# OUTPUTS
# ==============================================================================
Outputs:

  ForwarderRuleArn:
    Description: ARN of the EventBridge forwarding rule
    Value: !GetAtt CodeCommitForwarderRule.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ForwarderRuleArn"

  ForwarderRuleName:
    Description: Name of the EventBridge forwarding rule
    Value: !Ref CodeCommitForwarderRule
    Export:
      Name: !Sub "${AWS::StackName}-ForwarderRuleName"

  ForwarderRoleArn:
    Description: ARN of the cross-account PutEvents IAM Role
    Value: !GetAtt EventForwarderRole.Arn
    Export:
      Name: !Sub "${AWS::StackName}-ForwarderRoleArn"

  TargetEventBusArn:
    Description: Target Event Bus ARN in the Pipeline Account
    Value: !Ref PipelineEventBusArn
    Export:
      Name: !Sub "${AWS::StackName}-TargetEventBusArn"

  ForwardingStatus:
    Description: Whether event forwarding is currently enabled
    Value: !If [ForwardingEnabled, "ENABLED", "DISABLED"]
    Export:
      Name: !Sub "${AWS::StackName}-ForwardingStatus"

  RepositoryMonitored:
    Description: Repository and branch being monitored
    Value: !Sub "${RepositoryName}/${BranchName}"
    Export:
      Name: !Sub "${AWS::StackName}-RepositoryMonitored"
