AWSTemplateFormatVersion: "2010-09-09"
Description: "RDS Baseline - Provisions RDS instances with Multi-AZ, automated backups, encryption, and monitoring"

Parameters:
  ProjectName:
    Type: String
    Description: Project/system identifier

  EnvironmentName:
    Type: String
    AllowedValues: [dev, qa, uat, prod]
    Description: Deployment environment

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID for RDS deployment

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Subnet IDs for the DB subnet group

  DBEngine:
    Type: String
    Default: postgres
    AllowedValues: [postgres, mysql, mariadb, oracle-se2, sqlserver-se]
    Description: Database engine

  DBInstanceClass:
    Type: String
    Default: db.t3.medium
    Description: RDS instance class

  AllocatedStorage:
    Type: Number
    Default: 100
    Description: Allocated storage in GB

  EnableMultiAZ:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Enable Multi-AZ deployment

  BackupRetentionDays:
    Type: Number
    Default: 35
    MinValue: 0
    MaxValue: 35
    Description: Automated backup retention period

Conditions:
  MultiAZEnabled: !Equals [!Ref EnableMultiAZ, "Yes"]

Resources:
  # TODO: Implement DB subnet group, RDS instance, security group, parameter group

Outputs:
  DBEndpoint:
    Description: RDS endpoint address
    Value: "PLACEHOLDER"
  DBPort:
    Description: RDS port
    Value: "PLACEHOLDER"
