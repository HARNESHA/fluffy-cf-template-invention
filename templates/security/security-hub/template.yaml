AWSTemplateFormatVersion: "2010-09-09"
Description: "Security Hub Baseline - Enables AWS Security Hub with CIS, PCI DSS, and AWS Foundational Security Best Practices standards"

Parameters:
  ProjectName:
    Type: String
    Description: Project/system identifier

  EnvironmentName:
    Type: String
    AllowedValues: [dev, qa, uat, prod]
    Description: Deployment environment

  EnableCISStandard:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Enable CIS AWS Foundations Benchmark

  EnablePCIDSSStandard:
    Type: String
    AllowedValues: [Yes, No]
    Default: No
    Description: Enable PCI DSS standard

  EnableFSBPStandard:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Enable AWS Foundational Security Best Practices

Resources:
  # TODO: Implement Security Hub, standards subscriptions, admin account

Outputs:
  SecurityHubArn:
    Description: Security Hub ARN
    Value: "PLACEHOLDER"
