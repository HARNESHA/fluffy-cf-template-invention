AWSTemplateFormatVersion: "2010-09-09"
Description: "Config Baseline - Enables AWS Config with recording, rules, and remediation for compliance monitoring"

Parameters:
  ProjectName:
    Type: String
    Description: Project/system identifier

  EnvironmentName:
    Type: String
    AllowedValues: [dev, qa, uat, prod]
    Description: Deployment environment

  ConfigDeliveryBucketName:
    Type: String
    Default: ""
    Description: S3 bucket for Config snapshots (empty = new bucket created)

  EnableAllRules:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Enable all recommended Config rules

  EnableRemediation:
    Type: String
    AllowedValues: [Yes, No]
    Default: No
    Description: Enable automated remediation for non-compliant resources

Conditions:
  UseExistingBucket: !Not [!Equals [!Ref ConfigDeliveryBucketName, ""]]

Resources:
  # TODO: Implement Config recorder, delivery channel, rules, remediation

Outputs:
  ConfigBucketName:
    Description: Config delivery bucket name
    Value: "PLACEHOLDER"
