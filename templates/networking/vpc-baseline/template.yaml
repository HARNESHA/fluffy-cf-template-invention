AWSTemplateFormatVersion: "2010-09-09"
Description: "VPC Baseline - Provisions VPC with public/private subnets across multiple AZs, NAT gateways, route tables, and VPC Flow Logs"

Parameters:
  ProjectName:
    Type: String
    Description: Project/system identifier

  EnvironmentName:
    Type: String
    AllowedValues: [dev, qa, uat, prod]
    Description: Deployment environment

  VpcCIDR:
    Type: String
    AllowedPattern: ^([0-9]{1,3}\.){3}[0-9]{1,3}/[0-9]{1,2}$
    Default: 10.0.0.0/16
    Description: CIDR block for the VPC

  AvailabilityZoneCount:
    Type: Number
    Default: 3
    AllowedValues: [2, 3]
    Description: Number of Availability Zones

  EnableNATGateways:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Deploy NAT gateways for private subnets

  EnableFlowLogs:
    Type: String
    AllowedValues: [Yes, No]
    Default: Yes
    Description: Enable VPC Flow Logs to CloudWatch

Conditions:
  EnableNAT: !Equals [!Ref EnableNATGateways, "Yes"]
  EnableVPCFlowLogs: !Equals [!Ref EnableFlowLogs, "Yes"]

Resources:
  # TODO: Implement VPC, subnets, route tables, NAT gateways, Flow Logs

Outputs:
  VpcId:
    Description: VPC ID
    Value: "PLACEHOLDER"
  PrivateSubnetIds:
    Description: Private subnet IDs
    Value: "PLACEHOLDER"
  PublicSubnetIds:
    Description: Public subnet IDs
    Value: "PLACEHOLDER"
