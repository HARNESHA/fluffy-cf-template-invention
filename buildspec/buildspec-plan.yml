version: 0.2

env:
  shell: bash
  exported-variables:
    - RESOLVED_COMMIT_ID
    - PLAN_ARTIFACT_KEY
    - PLAN_SUMMARY

phases:

  # ---------------------------------------------------------------------------
  # INSTALL - Download and install Terraform at the pinned version
  # ---------------------------------------------------------------------------
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "=== [INSTALL] Starting Terraform ${TF_VERSION} installation ==="
      - |
        TF_ZIP="terraform_${TF_VERSION}_linux_amd64.zip"
        TF_URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
        echo "Downloading ${TF_URL}"
        curl -sSfL "${TF_URL}" -o /tmp/${TF_ZIP}
        curl -sSfL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" -o /tmp/terraform_SHA256SUMS
        cd /tmp && grep "${TF_ZIP}" terraform_SHA256SUMS | sha256sum --check -
        unzip -q /tmp/${TF_ZIP} -d /tmp/terraform-bin
        mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
        chmod +x /usr/local/bin/terraform
        terraform version
      - echo "=== [INSTALL] Terraform installation complete ==="

  # ---------------------------------------------------------------------------
  # PRE_BUILD - Resolve commit, assume execution role, configure environment
  # ---------------------------------------------------------------------------
  pre_build:
    commands:
      - echo "=== [PRE_BUILD] Configuring environment ==="
      - export RESOLVED_COMMIT_ID="${COMMIT_ID}"
      - |
        if [ -n "${CODEBUILD_RESOLVED_SOURCE_VERSION}" ] && [ "${CODEBUILD_RESOLVED_SOURCE_VERSION}" != "undefined" ]; then
          RESOLVED_COMMIT_ID="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
        elif [ -n "${RESOLVED_COMMIT_ID}" ] && [ "${RESOLVED_COMMIT_ID}" != "undefined" ] && [[ "${RESOLVED_COMMIT_ID}" != *"#"* ]]; then
          :
        else
          echo "No valid COMMIT_ID - using repo HEAD"
          RESOLVED_COMMIT_ID=$(git -C "${CODEBUILD_SRC_DIR}" rev-parse HEAD)
        fi
        export RESOLVED_COMMIT_ID
        echo "Resolved commit: ${RESOLVED_COMMIT_ID}"
      - export PLAN_ARTIFACT_KEY="${ARTIFACT_PREFIX}/${REPOSITORY_NAME}/${ENVIRONMENT}/${BRANCH_NAME}/plans/${RESOLVED_COMMIT_ID}"
      - export BUILD_START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - export AWS_REGION="${AWS_DEFAULT_REGION}"
      - 'echo "Project      : ${PROJECT_NAME}"'
      - 'echo "Environment  : ${ENVIRONMENT}"'
      - 'echo "Branch       : ${BRANCH_NAME}"'
      - 'echo "Commit       : ${RESOLVED_COMMIT_ID}"'
      - 'echo "TF Directory : ${TF_DIR}"'
      - 'echo "Pipeline     : ${PIPELINE_NAME}"'
      - 'echo "Execution ID : ${PIPELINE_EXECUTION_ID}"'
      - 'echo "Plan Key     : s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}/tfplan.binary"'
      # Keep the S3 backend on the CodeBuild role (repo account). The AWS
      # provider assumes the execution role for resource CRUD only.
      - |
        if [ "${TF_EXECUTION_ROLE_ARN}" != "NONE" ] && [ -n "${TF_EXECUTION_ROLE_ARN}" ]; then
          echo "AWS provider will assume execution role: ${TF_EXECUTION_ROLE_ARN}"
          export TF_VAR_tf_execution_role_arn="${TF_EXECUTION_ROLE_ARN}"
          export TF_VAR_tf_role_session_name="TerraformPlan-${PROJECT_NAME}-${PIPELINE_EXECUTION_ID}"
        else
          export TF_VAR_tf_execution_role_arn=""
          echo "No execution role configured - using CodeBuild instance role"
        fi
      - echo "=== [PRE_BUILD] Environment ready ==="

  # ---------------------------------------------------------------------------
  # BUILD - Terraform init, validate, plan
  # ---------------------------------------------------------------------------
  build:
    commands:
      - echo "=== [BUILD] Starting Terraform workflow ==="
      - cd "${CODEBUILD_SRC_DIR}/${TF_DIR}"

      # terraform init
      - echo "--- terraform init ---"
      - |
        terraform init \
          -backend-config="envs/${ENVIRONMENT}.tfbackend" \
          -backend-config="bucket=${TF_BACKEND_BUCKET}" \
          -backend-config="key=${TF_BACKEND_KEY}" \
          -backend-config="region=${TF_BACKEND_REGION}" \
          -backend-config="encrypt=true" \
          -input=false \
          -no-color
      - echo "init complete"

      # terraform validate
      - echo "--- terraform validate ---"
      - terraform validate -no-color
      - echo "validate passed"

      # terraform plan - save binary plan and human-readable output
      - echo "--- terraform plan ---"
      - mkdir -p "${CODEBUILD_SRC_DIR}/work"
      - |
        TF_ARGS=()
        if [ -n "${TF_VARS_FILE}" ] && [ "${TF_VARS_FILE}" != "undefined" ]; then
          TF_ARGS+=( -var-file="${TF_VARS_FILE}" )
        fi
        terraform plan \
          -var="environment=${ENVIRONMENT}" \
          -out="${CODEBUILD_SRC_DIR}/work/tfplan.binary" \
          -input=false \
          -no-color \
          "${TF_ARGS[@]}" \
          2>&1 | tee "${CODEBUILD_SRC_DIR}/work/plan.txt"
      - echo "plan complete"

      # Generate a short summary (resource counts)
      - echo "--- generating plan summary ---"
      - |
        PLAN_SUMMARY=$(grep -E "^Plan:|^No changes\." "${CODEBUILD_SRC_DIR}/work/plan.txt" \
          | head -1 \
          | sed 's/[[:space:]]*$//' \
          || echo "Plan completed - see plan.txt for details")
        export PLAN_SUMMARY="${PLAN_SUMMARY}"
        echo "Summary: ${PLAN_SUMMARY}"

      - echo "=== [BUILD] Terraform plan workflow complete ==="

  # ---------------------------------------------------------------------------
  # POST_BUILD - Upload plan artifacts to S3, publish SNS notification
  # ---------------------------------------------------------------------------
  post_build:
    commands:
      - echo "=== [POST_BUILD] Uploading artifacts ==="
      - export BUILD_STATUS="${CODEBUILD_BUILD_SUCCEEDING:-0}"
      - mkdir -p "${CODEBUILD_SRC_DIR}/work"

      # Upload binary plan + plan.txt to S3 (consumed by Apply stage)
      - |
        aws s3 cp "${CODEBUILD_SRC_DIR}/work/tfplan.binary" \
          "s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}/tfplan.binary" \
          --sse aws:kms \
          --no-progress
        aws s3 cp "${CODEBUILD_SRC_DIR}/work/plan.txt" \
          "s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}/plan.txt" \
          --sse aws:kms \
          --no-progress
        echo "Plan uploaded: s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}/"
        export PLAN_TXT_URL="https://s3.console.aws.amazon.com/s3/object/${ARTIFACT_BUCKET}?prefix=${PLAN_ARTIFACT_KEY}/plan.txt"

      # Publish SNS notification with plan details
      - |
        if [ "${SNS_TOPIC_ARN}" != "DISABLED" ] && [ -n "${SNS_TOPIC_ARN}" ] && [ "${BUILD_STATUS}" = "1" ]; then
          PIPELINE_URL="https://${AWS_REGION}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${PIPELINE_NAME}/view"
          if [ -s "${CODEBUILD_SRC_DIR}/work/plan.txt" ]; then
            PLAN_DETAILS=$(tail -c 150000 "${CODEBUILD_SRC_DIR}/work/plan.txt")
          else
            PLAN_DETAILS="(no plan.txt produced)"
          fi
          MESSAGE=$(printf '%s\n' \
            "TERRAFORM PLAN READY FOR REVIEW" \
            "=========================================" \
            "Project       : ${PROJECT_NAME}" \
            "Environment   : ${ENVIRONMENT}" \
            "Repository    : ${REPOSITORY_NAME}" \
            "Branch        : ${BRANCH_NAME}" \
            "Commit        : ${RESOLVED_COMMIT_ID}" \
            "-----------------------------------------" \
            "Plan Summary  : ${PLAN_SUMMARY}" \
            "-----------------------------------------" \
            "Pipeline      : ${PIPELINE_URL}" \
            "Plan Artifact : ${PLAN_TXT_URL}" \
            "=========================================" \
            "Action Required: Review the plan and approve or reject in CodePipeline." \
            "" \
            "--- FULL PLAN OUTPUT ---" \
            "${PLAN_DETAILS}")
          aws sns publish \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "REVIEW REQUIRED: Terraform Plan - ${PROJECT_NAME} (${ENVIRONMENT})" \
            --message "${MESSAGE}"
          echo "SNS notification published"
        elif [ "${BUILD_STATUS}" != "1" ]; then
          echo "Build failed - skipping success notification"
        else
          echo "SNS notifications disabled - skipping"
        fi

      - echo "=== [POST_BUILD] Complete ==="

# ---------------------------------------------------------------------------
# CACHE - Speed up subsequent builds by caching Terraform providers
# ---------------------------------------------------------------------------
cache:
  paths:
    - ".terraform/providers/**/*"
    - "/root/.terraform.d/plugin-cache/**/*"
