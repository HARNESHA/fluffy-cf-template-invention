# =============================================================================
# buildspec-plan.yml
# Terraform Plan Buildspec
# Used by: TerraformPlanProject (PLAN_ONLY and SEPARATE_PLAN_APPLY modes)
#
# Stages:
#   install   - Install Terraform at pinned version
#   pre_build - Assume execution role (if configured), set env vars
#   build     - terraform init → validate → plan → generate plan.txt
#   post_build - Upload artifacts to S3, publish SNS notification
#
# Environment Variables (injected by CodeBuild project + pipeline):
#   TF_VERSION              Terraform version to install
#   TF_DIR                  Relative path to terraform root module
#   TF_BACKEND_BUCKET       S3 bucket for remote state
#   TF_BACKEND_KEY          S3 key for remote state file
#   TF_BACKEND_REGION       Region of state bucket
#   PROJECT_NAME            Project identifier
#   ENVIRONMENT             dev / staging / prod / shared
#   BRANCH_NAME             Source branch
#   ARTIFACT_BUCKET         S3 bucket for plan artifacts
#   SNS_TOPIC_ARN           SNS topic for notifications (or "DISABLED")
#   TF_EXECUTION_ROLE_ARN   Role to assume before running terraform (or "NONE")
#   PIPELINE_EXECUTION_ID   Injected by CodePipeline
#   COMMIT_ID               Injected by CodePipeline
#   PIPELINE_NAME           Injected by CodePipeline
# =============================================================================

version: 0.2

env:
  shell: bash
  # Export these as pipeline variables for downstream stages
  exported-variables:
    - RESOLVED_COMMIT_ID
    - PLAN_ARTIFACT_KEY
    - PLAN_SUMMARY

phases:

  # ---------------------------------------------------------------------------
  # INSTALL - Download and install Terraform at the pinned version
  # ---------------------------------------------------------------------------
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "=== [INSTALL] Starting Terraform ${TF_VERSION} installation ==="
      - |
        TF_ZIP="terraform_${TF_VERSION}_linux_amd64.zip"
        TF_URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
        echo "Downloading ${TF_URL}"
        curl -sSfL "${TF_URL}" -o /tmp/${TF_ZIP}
        curl -sSfL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" -o /tmp/terraform_SHA256SUMS
        cd /tmp && grep "${TF_ZIP}" terraform_SHA256SUMS | sha256sum --check -
        unzip -q /tmp/${TF_ZIP} -d /tmp/terraform-bin
        mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
        chmod +x /usr/local/bin/terraform
        terraform version
      - echo "=== [INSTALL] Terraform installation complete ==="

  # ---------------------------------------------------------------------------
  # PRE_BUILD - Resolve commit, assume execution role, configure environment
  # ---------------------------------------------------------------------------
  pre_build:
    commands:
      - echo "=== [PRE_BUILD] Configuring environment ==="
      - export RESOLVED_COMMIT_ID="${COMMIT_ID:-$(git rev-parse HEAD)}"
      - export PLAN_ARTIFACT_KEY="${PROJECT_NAME}/${ENVIRONMENT}/${RESOLVED_COMMIT_ID}/tfplan.binary"
      - export BUILD_START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - export AWS_REGION="${AWS_DEFAULT_REGION}"
      - echo "Project      : ${PROJECT_NAME}"
      - echo "Environment  : ${ENVIRONMENT}"
      - echo "Branch       : ${BRANCH_NAME}"
      - echo "Commit       : ${RESOLVED_COMMIT_ID}"
      - echo "TF Directory : ${TF_DIR}"
      - echo "Pipeline     : ${PIPELINE_NAME}"
      - echo "Execution ID : ${PIPELINE_EXECUTION_ID}"
      # Assume Terraform execution role if configured
      - |
        if [ "${TF_EXECUTION_ROLE_ARN}" != "NONE" ] && [ -n "${TF_EXECUTION_ROLE_ARN}" ]; then
          echo "Assuming execution role: ${TF_EXECUTION_ROLE_ARN}"
          CREDS=$(aws sts assume-role \
            --role-arn "${TF_EXECUTION_ROLE_ARN}" \
            --role-session-name "TerraformPlan-${PROJECT_NAME}-${PIPELINE_EXECUTION_ID}" \
            --duration-seconds 3600 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          export AWS_ACCESS_KEY_ID=$(echo $CREDS | awk '{print $1}')
          export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | awk '{print $2}')
          export AWS_SESSION_TOKEN=$(echo $CREDS | awk '{print $3}')
          echo "Successfully assumed execution role"
        else
          echo "No execution role configured - using CodeBuild instance role"
        fi
      - echo "=== [PRE_BUILD] Environment ready ==="

  # ---------------------------------------------------------------------------
  # BUILD - Terraform init, validate, plan
  # ---------------------------------------------------------------------------
  build:
    commands:
      - echo "=== [BUILD] Starting Terraform workflow ==="
      - cd "${CODEBUILD_SRC_DIR}/${TF_DIR}"

      # terraform init
      - echo "--- terraform init ---"
      - |
        terraform init \
          -backend-config="bucket=${TF_BACKEND_BUCKET}" \
          -backend-config="key=${TF_BACKEND_KEY}" \
          -backend-config="region=${TF_BACKEND_REGION}" \
          -backend-config="encrypt=true" \
          -input=false \
          -no-color
      - echo "init complete"

      # terraform validate
      - echo "--- terraform validate ---"
      - terraform validate -no-color
      - echo "validate passed"

      # terraform plan - save binary plan and human-readable output
      - echo "--- terraform plan ---"
      - |
        terraform plan \
          -var="environment=${ENVIRONMENT}" \
          -out="${CODEBUILD_SRC_DIR}/tfplan.binary" \
          -input=false \
          -no-color \
          2>&1 | tee "${CODEBUILD_SRC_DIR}/plan.txt"
      - echo "plan complete"

      # Generate a short summary (resource counts)
      - echo "--- generating plan summary ---"
      - |
        PLAN_SUMMARY=$(grep -E "^Plan:|^No changes\." "${CODEBUILD_SRC_DIR}/plan.txt" \
          | head -1 \
          | sed 's/[[:space:]]*$//' \
          || echo "Plan completed - see plan.txt for details")
        export PLAN_SUMMARY="${PLAN_SUMMARY}"
        echo "Summary: ${PLAN_SUMMARY}"

      - echo "=== [BUILD] Terraform plan workflow complete ==="

  # ---------------------------------------------------------------------------
  # POST_BUILD - Upload artifacts, publish SNS notification
  # ---------------------------------------------------------------------------
  post_build:
    commands:
      - echo "=== [POST_BUILD] Uploading artifacts ==="
      - export BUILD_STATUS="${CODEBUILD_BUILD_SUCCEEDING:-0}"

      # Upload binary plan to S3 (used by Apply stage)
      - |
        aws s3 cp "${CODEBUILD_SRC_DIR}/tfplan.binary" \
          "s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}" \
          --sse aws:kms \
          --no-progress
        echo "Plan binary uploaded: s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}"

      # Upload human-readable plan text
      - |
        PLAN_TXT_KEY="${PROJECT_NAME}/${ENVIRONMENT}/${RESOLVED_COMMIT_ID}/plan.txt"
        aws s3 cp "${CODEBUILD_SRC_DIR}/plan.txt" \
          "s3://${ARTIFACT_BUCKET}/${PLAN_TXT_KEY}" \
          --sse aws:kms \
          --no-progress
        export PLAN_TXT_URL="https://s3.console.aws.amazon.com/s3/object/${ARTIFACT_BUCKET}?prefix=${PLAN_TXT_KEY}"
        echo "Plan text uploaded: ${PLAN_TXT_URL}"

      # Publish SNS notification with plan details
      - |
        if [ "${SNS_TOPIC_ARN}" != "DISABLED" ] && [ -n "${SNS_TOPIC_ARN}" ] && [ "${BUILD_STATUS}" = "1" ]; then
          PIPELINE_URL="https://${AWS_REGION}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${PIPELINE_NAME}/view"
          MESSAGE="TERRAFORM PLAN READY FOR REVIEW
=========================================
Project       : ${PROJECT_NAME}
Environment   : ${ENVIRONMENT}
Repository    : ${REPOSITORY_NAME}
Branch        : ${BRANCH_NAME}
Commit        : ${RESOLVED_COMMIT_ID}
-----------------------------------------
Plan Summary  : ${PLAN_SUMMARY}
-----------------------------------------
Pipeline      : ${PIPELINE_URL}
Plan Artifact : ${PLAN_TXT_URL}
=========================================
Action Required: Review the plan and approve or reject in CodePipeline."
          aws sns publish \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "REVIEW REQUIRED: Terraform Plan - ${PROJECT_NAME} (${ENVIRONMENT})" \
            --message "${MESSAGE}"
          echo "SNS notification published"
        elif [ "${BUILD_STATUS}" != "1" ]; then
          echo "Build failed - skipping success notification"
        else
          echo "SNS notifications disabled - skipping"
        fi

      - echo "=== [POST_BUILD] Complete ==="

# ---------------------------------------------------------------------------
# ARTIFACTS - Pass plan binary and text to downstream stages
# ---------------------------------------------------------------------------
artifacts:
  files:
    - tfplan.binary
    - plan.txt
  name: TerraformPlanArtifact
  discard-paths: "no"

# ---------------------------------------------------------------------------
# CACHE - Speed up subsequent builds by caching Terraform providers
# ---------------------------------------------------------------------------
cache:
  paths:
    - ".terraform/providers/**/*"
    - "/root/.terraform.d/plugin-cache/**/*"
