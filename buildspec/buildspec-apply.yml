version: 0.2

env:
  shell: bash
  exported-variables:
    - RESOLVED_COMMIT_ID
    - APPLY_STATUS

phases:


  # INSTALL - Download and install Terraform at the pinned version

  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "=== [INSTALL] Starting Terraform ${TF_VERSION} installation ==="
      - |
        TF_ZIP="terraform_${TF_VERSION}_linux_amd64.zip"
        TF_URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
        echo "Downloading ${TF_URL}"
        curl -sSfL "${TF_URL}" -o /tmp/${TF_ZIP}
        curl -sSfL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" -o /tmp/terraform_SHA256SUMS
        cd /tmp && grep "${TF_ZIP}" terraform_SHA256SUMS | sha256sum --check -
        unzip -q /tmp/${TF_ZIP} -d /tmp/terraform-bin
        mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
        chmod +x /usr/local/bin/terraform
        terraform version
      - echo "=== [INSTALL] Terraform installation complete ==="


  # PRE_BUILD - Resolve commit, assume execution role, download plan binary

  pre_build:
    commands:
      - echo "=== [PRE_BUILD] Configuring apply environment ==="
      - mkdir -p "${CODEBUILD_SRC_DIR}/work"
      - export RESOLVED_COMMIT_ID="${COMMIT_ID}"
      - |
        if [ -n "${CODEBUILD_RESOLVED_SOURCE_VERSION}" ] && [ "${CODEBUILD_RESOLVED_SOURCE_VERSION}" != "undefined" ]; then
          RESOLVED_COMMIT_ID="${CODEBUILD_RESOLVED_SOURCE_VERSION}"
        elif [ -n "${RESOLVED_COMMIT_ID}" ] && [ "${RESOLVED_COMMIT_ID}" != "undefined" ] && [[ "${RESOLVED_COMMIT_ID}" != *"#"* ]]; then
          :
        else
          echo "No valid COMMIT_ID - using repo HEAD"
          RESOLVED_COMMIT_ID=$(git -C "${CODEBUILD_SRC_DIR}" rev-parse HEAD)
        fi
        export RESOLVED_COMMIT_ID
        echo "Resolved commit: ${RESOLVED_COMMIT_ID}"
      - export PLAN_ARTIFACT_KEY="${ARTIFACT_PREFIX}/${ENVIRONMENT}/${BRANCH_NAME}/plans/${RESOLVED_COMMIT_ID}"
      - export APPLY_START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - export AWS_REGION="${AWS_DEFAULT_REGION}"
      - 'echo "Project      : ${PROJECT_NAME}"'
      - 'echo "Environment  : ${ENVIRONMENT}"'
      - 'echo "Branch       : ${BRANCH_NAME}"'
      - 'echo "Commit       : ${RESOLVED_COMMIT_ID}"'
      - 'echo "Pipeline     : ${PIPELINE_NAME}"'

      # Download the EXACT plan binary from S3 (keyed by commit)
      - |
        echo "Downloading plan: s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}/tfplan.binary"
        if ! aws s3 cp "s3://${ARTIFACT_BUCKET}/${PLAN_ARTIFACT_KEY}/tfplan.binary" \
            "${CODEBUILD_SRC_DIR}/work/tfplan.binary" --no-progress; then
          echo "ERROR: Plan binary not found at ${PLAN_ARTIFACT_KEY}/tfplan.binary"
          echo "Ensure the Plan stage ran successfully for commit ${RESOLVED_COMMIT_ID}."
          exit 1
        fi
        echo "Plan binary downloaded: ${CODEBUILD_SRC_DIR}/work/tfplan.binary"
        ls -lh "${CODEBUILD_SRC_DIR}/work/tfplan.binary"

      # Keep the S3 backend on the CodeBuild role (repo account). The AWS
      # provider assumes the execution role for resource CRUD only.
      - |
        if [ "${TF_EXECUTION_ROLE_ARN}" != "NONE" ] && [ -n "${TF_EXECUTION_ROLE_ARN}" ]; then
          echo "AWS provider will assume execution role: ${TF_EXECUTION_ROLE_ARN}"
          export TF_VAR_tf_execution_role_arn="${TF_EXECUTION_ROLE_ARN}"
          export TF_VAR_tf_role_session_name="${PROJECT_NAME}-${ENVIRONMENT}"
        else
          export TF_VAR_tf_execution_role_arn=""
          echo "No execution role configured - using CodeBuild instance role"
        fi

      - echo "=== [PRE_BUILD] Apply environment ready ==="


  # BUILD - Terraform init (providers only) → apply saved plan binary

  build:
    commands:
      - echo "=== [BUILD] Starting Terraform apply ==="
      - cd "${CODEBUILD_SRC_DIR}/${TF_DIR}"

      # Re-run init to restore providers (no re-plan, no backend changes)
      - echo "--- terraform init (provider restore) ---"
      - |
        terraform init \
          -backend-config="envs/${ENVIRONMENT}.tfbackend" \
          -backend-config="bucket=${TF_BACKEND_BUCKET}" \
          -backend-config="key=${TF_BACKEND_KEY}" \
          -backend-config="region=${TF_BACKEND_REGION}" \
          -backend-config="encrypt=true" \
          -input=false \
          -no-color
      - echo "init complete"

      # Apply the EXACT plan binary - no surprises
      - echo "--- terraform apply (saved plan) ---"
      - |
        set -o pipefail
        terraform apply \
          -input=false \
          -no-color \
          "${CODEBUILD_SRC_DIR}/work/tfplan.binary" \
          2>&1 | tee "${CODEBUILD_SRC_DIR}/work/apply.txt"
      - echo "apply complete"

      # Capture apply status
      - export APPLY_STATUS="SUCCESS"
      - echo "=== [BUILD] Terraform apply complete ==="


  # POST_BUILD - Upload apply log to S3, publish SNS result notification

  post_build:
    commands:
      - echo "=== [POST_BUILD] Publishing apply result ==="
      - export BUILD_STATUS="${CODEBUILD_BUILD_SUCCEEDING:-0}"

      # Upload apply output log
      - |
        if [ -f "${CODEBUILD_SRC_DIR}/work/apply.txt" ]; then
          LOG_KEY="${ARTIFACT_PREFIX}/${ENVIRONMENT}/${BRANCH_NAME}/logs/${CODEBUILD_BUILD_ID}"
          aws s3 cp "${CODEBUILD_SRC_DIR}/work/apply.txt" \
            "s3://${ARTIFACT_BUCKET}/${LOG_KEY}/apply.txt" \
            --sse aws:kms \
            --no-progress
          echo "Apply log uploaded: s3://${ARTIFACT_BUCKET}/${LOG_KEY}/apply.txt"
        fi

      # Notify success or failure via SNS
      - |
        if [ "${SNS_TOPIC_ARN}" != "DISABLED" ] && [ -n "${SNS_TOPIC_ARN}" ]; then
          PIPELINE_URL="https://${AWS_REGION}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${PIPELINE_NAME}/view"
          if [ "${BUILD_STATUS}" = "1" ]; then
            RESULT_STATUS="SUCCESS"
            SUBJECT="SUCCESS: Terraform Apply - ${PROJECT_NAME} (${ENVIRONMENT})"
            RESULT_NOTE="Infrastructure changes have been applied successfully."
          else
            export APPLY_STATUS="FAILED"
            RESULT_STATUS="FAILED"
            SUBJECT="FAILED: Terraform Apply - ${PROJECT_NAME} (${ENVIRONMENT})"
            RESULT_NOTE="Apply failed. Review the CodeBuild logs for details."
          fi
          MESSAGE=$(printf '%s\n' \
            "TERRAFORM APPLY ${RESULT_STATUS}" \
            "=========================================" \
            "Project       : ${PROJECT_NAME}" \
            "Environment   : ${ENVIRONMENT}" \
            "Repository    : ${REPOSITORY_NAME}" \
            "Branch        : ${BRANCH_NAME}" \
            "Commit        : ${RESOLVED_COMMIT_ID}" \
            "-----------------------------------------" \
            "Result        : ${RESULT_STATUS}" \
            "Note          : ${RESULT_NOTE}" \
            "-----------------------------------------" \
            "Pipeline      : ${PIPELINE_URL}" \
            "=========================================" \
            "Executed at   : $(date -u +"%Y-%m-%dT%H:%M:%SZ")")
          aws sns publish \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "${SUBJECT}" \
            --message "${MESSAGE}"
          echo "SNS notification published: ${RESULT_STATUS}"
        else
          echo "SNS notifications disabled - skipping"
        fi

      - echo "=== [POST_BUILD] Complete ==="