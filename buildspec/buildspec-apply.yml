# =============================================================================
# buildspec-apply.yml
# Terraform Apply Buildspec
# Used by: TerraformApplyProject (SEPARATE_PLAN_APPLY mode only)
#
# IMPORTANT: This buildspec consumes the saved plan binary produced by the
# Plan stage. It does NOT re-plan. This guarantees that exactly what was
# reviewed and approved is what gets applied.
#
# Stages:
#   install   - Install Terraform at pinned version
#   pre_build - Assume execution role (if configured), retrieve plan binary
#   build     - terraform init → apply (saved plan)
#   post_build - Publish SNS result notification
#
# Input Artifact: PlanOutput (from Plan stage - contains tfplan.binary)
# =============================================================================

version: 0.2

env:
  shell: bash
  exported-variables:
    - RESOLVED_COMMIT_ID
    - APPLY_STATUS

phases:

  # ---------------------------------------------------------------------------
  # INSTALL - Download and install Terraform at the pinned version
  # ---------------------------------------------------------------------------
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "=== [INSTALL] Starting Terraform ${TF_VERSION} installation ==="
      - |
        TF_ZIP="terraform_${TF_VERSION}_linux_amd64.zip"
        TF_URL="https://releases.hashicorp.com/terraform/${TF_VERSION}/${TF_ZIP}"
        echo "Downloading ${TF_URL}"
        curl -sSfL "${TF_URL}" -o /tmp/${TF_ZIP}
        curl -sSfL "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_SHA256SUMS" -o /tmp/terraform_SHA256SUMS
        cd /tmp && grep "${TF_ZIP}" terraform_SHA256SUMS | sha256sum --check -
        unzip -q /tmp/${TF_ZIP} -d /tmp/terraform-bin
        mv /tmp/terraform-bin/terraform /usr/local/bin/terraform
        chmod +x /usr/local/bin/terraform
        terraform version
      - echo "=== [INSTALL] Terraform installation complete ==="

  # ---------------------------------------------------------------------------
  # PRE_BUILD - Assume execution role, verify plan binary exists
  # ---------------------------------------------------------------------------
  pre_build:
    commands:
      - echo "=== [PRE_BUILD] Configuring apply environment ==="
      - export RESOLVED_COMMIT_ID="${COMMIT_ID:-$(git rev-parse HEAD 2>/dev/null || echo 'unknown')}"
      - export APPLY_START_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - export AWS_REGION="${AWS_DEFAULT_REGION}"
      - echo "Project      : ${PROJECT_NAME}"
      - echo "Environment  : ${ENVIRONMENT}"
      - echo "Branch       : ${BRANCH_NAME}"
      - echo "Commit       : ${RESOLVED_COMMIT_ID}"
      - echo "Pipeline     : ${PIPELINE_NAME}"
      - echo "Execution ID : ${PIPELINE_EXECUTION_ID}"

      # Verify the plan binary artifact was passed from the Plan stage
      - |
        if [ ! -f "${CODEBUILD_SRC_DIR}/tfplan.binary" ]; then
          echo "ERROR: tfplan.binary not found in input artifact."
          echo "Ensure the Apply stage has PlanOutput as its input artifact."
          exit 1
        fi
        echo "Plan binary verified: ${CODEBUILD_SRC_DIR}/tfplan.binary"
        ls -lh "${CODEBUILD_SRC_DIR}/tfplan.binary"

      # Assume Terraform execution role if configured
      - |
        if [ "${TF_EXECUTION_ROLE_ARN}" != "NONE" ] && [ -n "${TF_EXECUTION_ROLE_ARN}" ]; then
          echo "Assuming execution role: ${TF_EXECUTION_ROLE_ARN}"
          CREDS=$(aws sts assume-role \
            --role-arn "${TF_EXECUTION_ROLE_ARN}" \
            --role-session-name "TerraformApply-${PROJECT_NAME}-${PIPELINE_EXECUTION_ID}" \
            --duration-seconds 7200 \
            --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
            --output text)
          export AWS_ACCESS_KEY_ID=$(echo $CREDS | awk '{print $1}')
          export AWS_SECRET_ACCESS_KEY=$(echo $CREDS | awk '{print $2}')
          export AWS_SESSION_TOKEN=$(echo $CREDS | awk '{print $3}')
          echo "Successfully assumed execution role"
        else
          echo "No execution role configured - using CodeBuild instance role"
        fi

      - echo "=== [PRE_BUILD] Apply environment ready ==="

  # ---------------------------------------------------------------------------
  # BUILD - Terraform init (providers only) → apply saved plan
  # ---------------------------------------------------------------------------
  build:
    commands:
      - echo "=== [BUILD] Starting Terraform apply ==="
      - cd "${CODEBUILD_SRC_DIR}/${TF_DIR}"

      # Re-run init to restore providers (no re-plan, no backend changes)
      - echo "--- terraform init (provider restore) ---"
      - |
        terraform init \
          -backend-config="bucket=${TF_BACKEND_BUCKET}" \
          -backend-config="key=${TF_BACKEND_KEY}" \
          -backend-config="region=${TF_BACKEND_REGION}" \
          -backend-config="encrypt=true" \
          -input=false \
          -no-color
      - echo "init complete"

      # Apply the EXACT plan binary - no surprises
      - echo "--- terraform apply (saved plan) ---"
      - |
        terraform apply \
          -input=false \
          -no-color \
          "${CODEBUILD_SRC_DIR}/tfplan.binary" \
          2>&1 | tee "${CODEBUILD_SRC_DIR}/apply.txt"
      - echo "apply complete"

      # Capture apply status
      - export APPLY_STATUS="SUCCESS"
      - echo "=== [BUILD] Terraform apply complete ==="

  # ---------------------------------------------------------------------------
  # POST_BUILD - Publish SNS result notification
  # ---------------------------------------------------------------------------
  post_build:
    commands:
      - echo "=== [POST_BUILD] Publishing apply result ==="
      - export BUILD_STATUS="${CODEBUILD_BUILD_SUCCEEDING:-0}"

      # Upload apply output log
      - |
        if [ -f "${CODEBUILD_SRC_DIR}/apply.txt" ]; then
          APPLY_LOG_KEY="${PROJECT_NAME}/${ENVIRONMENT}/${RESOLVED_COMMIT_ID}/apply.txt"
          aws s3 cp "${CODEBUILD_SRC_DIR}/apply.txt" \
            "s3://${ARTIFACT_BUCKET}/${APPLY_LOG_KEY}" \
            --sse aws:kms \
            --no-progress
          echo "Apply log uploaded: s3://${ARTIFACT_BUCKET}/${APPLY_LOG_KEY}"
        fi

      # Notify success or failure via SNS
      - |
        if [ "${SNS_TOPIC_ARN}" != "DISABLED" ] && [ -n "${SNS_TOPIC_ARN}" ]; then
          PIPELINE_URL="https://${AWS_REGION}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${PIPELINE_NAME}/view"
          if [ "${BUILD_STATUS}" = "1" ]; then
            RESULT_STATUS="SUCCESS"
            SUBJECT="SUCCESS: Terraform Apply - ${PROJECT_NAME} (${ENVIRONMENT})"
            RESULT_NOTE="Infrastructure changes have been applied successfully."
          else
            export APPLY_STATUS="FAILED"
            RESULT_STATUS="FAILED"
            SUBJECT="FAILED: Terraform Apply - ${PROJECT_NAME} (${ENVIRONMENT})"
            RESULT_NOTE="Apply failed. Review the CodeBuild logs for details."
          fi
          MESSAGE="TERRAFORM APPLY ${RESULT_STATUS}
=========================================
Project       : ${PROJECT_NAME}
Environment   : ${ENVIRONMENT}
Repository    : ${REPOSITORY_NAME}
Branch        : ${BRANCH_NAME}
Commit        : ${RESOLVED_COMMIT_ID}
-----------------------------------------
Result        : ${RESULT_STATUS}
Note          : ${RESULT_NOTE}
-----------------------------------------
Pipeline      : ${PIPELINE_URL}
=========================================
Executed at   : $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          aws sns publish \
            --topic-arn "${SNS_TOPIC_ARN}" \
            --subject "${SUBJECT}" \
            --message "${MESSAGE}"
          echo "SNS notification published: ${RESULT_STATUS}"
        else
          echo "SNS notifications disabled - skipping"
        fi

      - echo "=== [POST_BUILD] Complete ==="

# ---------------------------------------------------------------------------
# ARTIFACTS - Preserve apply output log
# ---------------------------------------------------------------------------
artifacts:
  files:
    - apply.txt
  name: TerraformApplyArtifact
  discard-paths: "no"

# ---------------------------------------------------------------------------
# CACHE - Reuse providers from plan stage cache
# ---------------------------------------------------------------------------
cache:
  paths:
    - ".terraform/providers/**/*"
    - "/root/.terraform.d/plugin-cache/**/*"
